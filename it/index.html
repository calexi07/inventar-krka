<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IT — Regiuni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="min-h-screen px-6 py-8">
  <div class="max-w-5xl mx-auto">
    <nav class="crumb mb-6"><a href="../index.html">Inventar</a> / IT</nav>

    <div class="flex items-end justify-between mb-6 flex-wrap gap-3">
      <div>
        <h1 class="font-display text-3xl font-semibold">Regiuni IT</h1>
        <p class="text-[var(--ink-soft)] text-sm mt-1">Alege o regiune pentru a vedea angajații.</p>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button id="add-region-btn" class="btn-ghost">+ Regiune nouă</button>
        <button id="download-all-zip-btn" class="btn-primary">Descarcă tot (ZIP)</button>
      </div>
    </div>

    <div id="regions-grid" class="grid sm:grid-cols-2 md:grid-cols-3 gap-4">
      <div class="skeleton h-28"></div>
      <div class="skeleton h-28"></div>
      <div class="skeleton h-28"></div>
    </div>
  </div>

  <script type="module" src="../js/it-regions.js"></script>
</body>
</html>
