<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IT — Poze angajat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="min-h-screen px-6 py-8">
  <div class="max-w-4xl mx-auto">
    <nav class="crumb mb-6">
      <a href="../index.html">Inventar</a> / <a href="index.html">IT</a> /
      <a id="crumb-region" href="#">…</a> / <span id="crumb-employee">…</span>
    </nav>

    <div class="mb-6 flex items-start justify-between flex-wrap gap-3">
      <div>
        <h1 id="employee-title" class="font-display text-3xl font-semibold">…</h1>
        <p class="text-[var(--ink-soft)] text-sm mt-1">Pozele echipamentului acestui angajat.</p>
      </div>
      <label class="folder-card flex items-center gap-2 !py-2.5 !px-4 cursor-pointer select-none">
        <input id="verified-checkbox" type="checkbox" class="w-4 h-4 accent-[var(--accent)]" />
        <span class="text-sm font-medium">Verificat</span>
      </label>
    </div>

    <div class="mb-6">
      <label for="notes-field" class="text-sm font-medium block mb-1.5">Notițe</label>
      <textarea id="notes-field" class="field-input" rows="3" placeholder="Adaugă observații despre acest angajat…"></textarea>
      <div class="flex items-center gap-3 mt-2">
        <button id="save-notes-btn" class="btn-ghost !py-1.5 !px-3 text-sm">Salvează notițele</button>
        <span id="notes-status" class="text-xs text-[var(--ink-soft)]"></span>
      </div>
    </div>

    <label id="dropzone" class="dropzone block mb-6 cursor-pointer" for="file-input">
      <p class="font-medium">Trage poze aici sau apasă pentru a alege</p>
      <p class="text-xs mt-1">JPG, PNG — se pot încărca mai multe simultan</p>
      <input id="file-input" type="file" accept="image/*" multiple class="hidden" />
    </label>

    <div id="photos-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
      <div class="skeleton photo-tile"></div>
      <div class="skeleton photo-tile"></div>
    </div>
  </div>

  <script type="module" src="../js/it-employee-detail.js"></script>
</body>
</html>
