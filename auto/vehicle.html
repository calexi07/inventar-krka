<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Auto — Poze mașină</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="min-h-screen px-6 py-8">
  <div class="max-w-4xl mx-auto">
    <nav class="crumb mb-6">
      <a href="../index.html">Inventar</a> / <a href="index.html">Auto</a> /
      <a id="crumb-region" href="#">…</a> / <span id="crumb-vehicle">…</span>
    </nav>

    <div class="mb-6 flex items-start justify-between flex-wrap gap-3">
      <div>
        <h1 id="vehicle-title" class="font-display text-3xl font-semibold">…</h1>
        <p class="text-[var(--ink-soft)] text-sm mt-1">Pozele acestei mașini.</p>
      </div>
      <label class="folder-card flex items-center gap-2 !py-2.5 !px-4 cursor-pointer select-none">
        <input id="verified-checkbox" type="checkbox" class="w-4 h-4 accent-[var(--accent)]" />
        <span class="text-sm font-medium">Verificat</span>
      </label>
    </div>

    <div class="mb-6">
      <label for="notes-field" class="text-sm font-medium block mb-1.5">Notițe</label>
      <textarea id="notes-field" class="field-input" rows="3" placeholder="Adaugă observații despre această mașină…"></textarea>
      <div class="flex items-center gap-3 mt-2">
        <button id="save-notes-btn" class="btn-ghost !py-1.5 !px-3 text-sm">Salvează notițele</button>
        <span id="notes-status" class="text-xs text-[var(--ink-soft)]"></span>
      </div>
    </div>

    <div class="mb-6 flex flex-col sm:flex-row gap-3">
      <label id="dropzone" for="file-input" class="dropzone flex-1 cursor-pointer flex flex-col items-center justify-center">
        <p class="font-medium">Alege din galerie</p>
        <p class="text-xs mt-1">Trage poze aici sau apasă pentru a alege — se pot alege mai multe</p>
        <input id="file-input" type="file" accept="image/*" multiple class="hidden" />
      </label>
      <label for="camera-input" class="dropzone flex-1 cursor-pointer flex flex-col items-center justify-center">
        <p class="font-medium">Fă o poză</p>
        <p class="text-xs mt-1">Deschide camera telefonului</p>
        <input id="camera-input" type="file" accept="image/*" capture="environment" class="hidden" />
      </label>
    </div>

    <div id="photos-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
      <div class="skeleton photo-tile"></div>
      <div class="skeleton photo-tile"></div>
    </div>
  </div>

  <div id="lightbox" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-40 p-4" role="dialog" aria-modal="true">
    <button id="lightbox-close" class="absolute top-4 right-4 text-white text-2xl leading-none" aria-label="Închide">&times;</button>
    <img id="lightbox-img" src="" alt="" class="max-w-full max-h-full rounded-lg" />
  </div>

  <script type="module" src="../js/auto-vehicle-detail.js"></script>
</body>
</html>
